<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Name style — Coworking</title>
  <link rel="stylesheet" href="/styles.css" />
    <script src="/theme.js"></script>
</head>
<body>
  <header id="site-header">
    <strong><a href="/">Coworking</a></strong>
    <span id="auth-bar"></span>
  </header>
  <hr />

  <div class="pane page-form">
    <h2 class="pane-title">Name style</h2>
    <form id="style-form">
      <p>
        <label>🏙️ Daylight color: <input type="color" id="style-color" value="#000000" /></label>
      </p>
      <p>
        <label>🌇 Sunset color: <input type="color" id="style-color-sunset" value="#cccccc" /></label>
        <span id="style-sunset-auto">(auto)</span>
        <button type="button" id="style-sunset-reset" hidden>Use auto</button>
      </p>
      <p>
        <label>Font:
          <select id="style-font">
            <option value="Georgia, serif">Georgia</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="Verdana, sans-serif">Verdana</option>
            <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
            <option value="Impact, sans-serif">Impact</option>
            <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
            <option value="Palatino, 'Palatino Linotype', serif">Palatino</option>
            <option value="Garamond, serif">Garamond</option>
            <option value="'Arial Black', sans-serif">Arial Black</option>
            <option value="Monaco, Consolas, monospace">Monaco</option>
            <option value="'Brush Script MT', cursive">Brush Script</option>
          </select>
        </label>
      </p>
      <p>Preview:</p>
      <p class="style-previews">
        <span class="style-swatch style-swatch-day"><span id="style-name-preview">username</span></span>
        <span class="style-swatch style-swatch-sunset"><span id="style-name-preview-sunset">username</span></span>
      </p>
      <p id="style-error" hidden></p>
      <p>
        <button type="submit">Save</button>
        <button type="button" onclick="window.location.href = '/'">Cancel</button>
      </p>
    </form>
  </div>

  <script>
    const previewEl = document.getElementById('style-name-preview');
    const previewSunsetEl = document.getElementById('style-name-preview-sunset');
    const colorEl = document.getElementById('style-color');
    const sunsetEl = document.getElementById('style-color-sunset');
    const sunsetAutoEl = document.getElementById('style-sunset-auto');
    const sunsetResetEl = document.getElementById('style-sunset-reset');
    const fontEl = document.getElementById('style-font');
    const authBar = document.getElementById('auth-bar');

    // Until a sunset color is picked, it follows the daylight color (a pale, bright tint of it)
    let sunsetCustom = false;

    function updatePreview() {
      if (!sunsetCustom) sunsetEl.value = window.sunsetDefaultColor(colorEl.value);
      sunsetAutoEl.hidden = sunsetCustom;
      sunsetResetEl.hidden = !sunsetCustom;
      previewEl.style.color = colorEl.value;
      previewSunsetEl.style.color = sunsetEl.value;
      previewEl.style.fontFamily = fontEl.value;
      previewSunsetEl.style.fontFamily = fontEl.value;
    }
    colorEl.addEventListener('input', updatePreview);
    sunsetEl.addEventListener('input', () => {
      sunsetCustom = true;
      updatePreview();
    });
    sunsetResetEl.addEventListener('click', () => {
      sunsetCustom = false;
      updatePreview();
    });
    fontEl.addEventListener('change', updatePreview);

    // Load current user
    fetch('/api/bootstrap', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(data => {
        if (!data.user) {
          window.location.href = '/login.html';
          return;
        }
        previewEl.textContent = data.user.username;
        previewSunsetEl.textContent = data.user.username;
        colorEl.value = data.user.name_color || '#000000';
        if (/^#[0-9a-fA-F]{6}$/.test(data.user.name_color_sunset || '')) {
          sunsetCustom = true;
          sunsetEl.value = data.user.name_color_sunset;
        }
        fontEl.value = data.user.name_font || 'Georgia, serif';
        updatePreview();
        authBar.textContent = data.user.username;
      })
      .catch(() => {
        window.location.href = '/login.html';
      });

    document.getElementById('style-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('style-error');
      errEl.hidden = true;
      try {
        const res = await fetch('/api/auth/profile', {
          method: 'PATCH',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name_color: colorEl.value,
            name_color_sunset: sunsetCustom ? sunsetEl.value : null,
            name_font: fontEl.value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Save failed.');
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.hidden = false;
      }
    });
  </script>
</body>
</html>
