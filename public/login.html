<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Coworking</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="site-header">
    <strong><a href="/">Coworking</a></strong>
    <span><a href="/signup.html">Sign up</a></span>
  </header>
  <hr />

  <div class="pane page-form">
    <h2 class="pane-title">Log in</h2>
    <form id="login-form">
      <p>
        <label>Username or email<br />
          <input type="text" id="login-identifier" autocomplete="username" required />
        </label>
      </p>
      <p>
        <label>Password<br />
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
      </p>
      <p id="login-error" hidden></p>
      <p>
        <button type="submit">Log in</button>
        <button type="button" id="forgot-btn">Forgot password?</button>
      </p>
    </form>

    <!-- Password reset: links are made by the site admin -->
    <div id="forgot-panel" hidden>
      <p>To reset your password, ask the site admin for a reset link. It lets you choose a new password and works once.</p>
      <p><button type="button" id="forgot-cancel">Back to log in</button></p>
    </div>

    <p><a href="/signup.html">Don't have an account?</a></p>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const forgotPanel = document.getElementById('forgot-panel');
    const showForgot = (show) => {
      loginForm.hidden = show;
      forgotPanel.hidden = !show;
      document.querySelector('.pane-title').textContent = show ? 'Reset password' : 'Log in';
    };
    document.getElementById('forgot-btn').addEventListener('click', () => showForgot(true));
    document.getElementById('forgot-cancel').addEventListener('click', () => showForgot(false));
    if (new URLSearchParams(location.search).get('forgot') === '1') showForgot(true);

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      errEl.hidden = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier: document.getElementById('login-identifier').value.trim(),
            password: document.getElementById('login-password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed.');
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.hidden = false;
      }
    });
  </script>
</body>
</html>
