name = "coworking-hub"
main = "src/worker.js"
compatibility_date = "2026-11-01"

routes = [
  { pattern = "coworking.jakewel.ch", custom_domain = true }
]

# Serves static HTML/CSS/JS from ./public and routes /api/* through src/worker.js
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Cloudflare D1 SQLite Database
[[d1_databases]]
binding = "DB"
database_name = "coworking-db"
database_id = "3d37f932-c9ae-436c-af14-570e004e5ff3"

# Daily at 04:00 UTC: delete chat messages, DMs and attachments older than 30 days
[triggers]
crons = ["0 4 * * *"]

[vars]
ARENA_CHANNEL_STATUS = "private"
